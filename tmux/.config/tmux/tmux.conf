set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# https://www.rushiagr.com/blog/2016/06/16/everything-you-need-to-know-about-tmux-copy-pasting-ubuntu/
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Start windows numbering at 1
set -g base-index 1
setw -g mode-keys vi
unbind C-b # unbind default leader key
set-option -g prefix C-s
# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0
# increase scrollback buffer size
set -g history-limit 50000
# upgrade $TERM
set -g default-terminal "st-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable SIXEL support in tmux (doesn't work yet)
# set-option -g default-terminal "xterm-256color"
# set-option -ga terminal-overrides ',xterm-256color:Tc:sitm=\E[3m'

# set -sa terminal-overrides ",foot:Tc"
# emacs key bindings in tmux command prompt (prefix + :) are better than
# emacs keys, even for vim users
set -g status-keys emacs
# set -g status off


set-option -g default-command $SHELL
set-option -g renumber-windows on
# focus events enabled for terminals that support them
set -g focus-events on
# super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r C-h resize-pane -L
bind-key -r C-j resize-pane -D
bind-key -r C-k resize-pane -U
bind-key -r C-l resize-pane -R

set -g mouse on

set-option -g visual-activity off
set-option -g set-titles on

# copy on selection with mouse
# https://unix.stackexchange.com/questions/318281/how-to-copy-and-paste-with-a-mouse-with-tmux
# Linux only
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down
# To copy, left click and drag to highlight text in yellow,
# once you release left click yellow text will disappear and will automatically be available in clibboard
# # Use vim keybindings in copy mode
setw -g mode-keys vi
# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
# bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection c"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip-or-wl-copy"
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip-or-wl-copy"

# By default, all windows in a session are constrained to the size of the
# smallest client connected to that session,
# even if both clients are looking at different windows.
# It seems that in this particular case, Screen has the better default
# where a window is only constrained in size if a smaller client
# is actively looking at it.
setw -g aggressive-resize on

# set -g status-bg "#000000"
# set -g status-fg "#928374"
# setw -g window-status-current-format '#I: #W'
# set -g window-status-format '#I: #W'
# set-option -g status-position bottom
# set-option -g status-left ''
# set-option -g status-right ''
