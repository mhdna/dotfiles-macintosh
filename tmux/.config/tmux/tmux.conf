##### TERMINAL FIXES #####

set -g default-terminal "st-256color"
set -as terminal-overrides ",*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'


##### GENERAL SETTINGS #####

set -g base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 0
set -g focus-events on

set -g status-keys emacs

set-option -g default-command "$SHELL"


##### PREFIX #####

unbind C-b
set -g prefix C-s
bind C-s send-prefix


##### RELOAD CONFIG #####

bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"


##### MOUSE #####

set -g mouse on

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" \
 "send-keys -M" \
 "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"

bind -n WheelDownPane select-pane -t= \; send-keys -M

bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M


##### COPY MODE (VIM STYLE) #####

setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/bin/xclip-or-wl-copy"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "~/bin/xclip-or-wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/bin/xclip-or-wl-copy"

bind-key -n M-s copy-mode


##### PANE NAVIGATION #####

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


##### PANE RESIZE #####

bind-key -r C-h resize-pane -L
bind-key -r C-j resize-pane -D
bind-key -r C-k resize-pane -U
bind-key -r C-l resize-pane -R


##### WINDOW MANAGEMENT #####

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind-key -n M-\; split-window -c "#{pane_current_path}"
bind-key -n M-\: split-window -h -c "#{pane_current_path}"

bind-key -n M-l last-window

bind-key -n C-1 if-shell 'tmux select-window -t :1' '' 'new-window -c "#{pane_current_path}" -t :1'
bind-key -n C-2 if-shell 'tmux select-window -t :2' '' 'new-window -c "#{pane_current_path}" -t :2'
bind-key -n C-3 if-shell 'tmux select-window -t :3' '' 'new-window -c "#{pane_current_path}" -t :3'
bind-key -n C-4 if-shell 'tmux select-window -t :4' '' 'new-window -c "#{pane_current_path}" -t :4'
bind-key -n C-5 if-shell 'tmux select-window -t :5' '' 'new-window -c "#{pane_current_path}" -t :5'
bind-key -n C-6 if-shell 'tmux select-window -t :6' '' 'new-window -c "#{pane_current_path}" -t :6'
bind-key -n C-7 if-shell 'tmux select-window -t :7' '' 'new-window -c "#{pane_current_path}" -t :7'
bind-key -n C-8 if-shell 'tmux select-window -t :8' '' 'new-window -c "#{pane_current_path}" -t :8'
bind-key -n C-9 run-shell 'tmux select-window -t :$(tmux list-windows | tail -n1 | cut -d ":" -f1)'


##### WINDOW ROTATION #####

bind -n C-t rotate-window


##### DETACH #####

bind-key -n M-q detach-client


##### APPLICATION SHORTCUTS #####

bind-key o new-window "htop"

bind-key -n M-w run-shell 'tmux-popup popup-main'
bind-key -n M-h run-shell 'tmux-scratchpad htop-scratch htop'
bind-key -n M-g run-shell 'tmux-scratchpad git-scratch lazygit -p "#{pane_current_path}"'


##### URL VIEWER #####

bind-key u capture-pane \; save-buffer /tmp/tmux-buffer \; \
new-window -n "urlview" '$SHELL -c "urlview < /tmp/tmux-buffer"'


##### STATUS BAR #####

set -g status-bg "#1d1d1d"
set -g status-fg "#988374"

set-option -g status-justify left
set-option -g status-interval 1

set-option -g status-left ''
set-option -g status-right ' #[fg=#928374][#S]'

setw -g window-status-current-style 'bg=#1d2021,fg=#ebdbb2,bold'
setw -g window-status-current-format '#I: #W'
set -g window-status-format '#I: #W'


##### MODE STYLE #####

setw -g mode-style bg=yellow,fg=black


##### WINDOW BEHAVIOR #####

setw -g aggressive-resize on

##### WINDOW SWITCHING WITH OPTION #####

bind-key -n M-1 if-shell "tmux select-window -t :1" "" "new-window -t :1 -c '#{pane_current_path}'"
bind-key -n M-2 if-shell "tmux select-window -t :2" "" "new-window -t :2 -c '#{pane_current_path}'"
bind-key -n M-3 if-shell "tmux select-window -t :3" "" "new-window -t :3 -c '#{pane_current_path}'"
bind-key -n M-4 if-shell "tmux select-window -t :4" "" "new-window -t :4 -c '#{pane_current_path}'"
bind-key -n M-5 if-shell "tmux select-window -t :5" "" "new-window -t :5 -c '#{pane_current_path}'"
bind-key -n M-6 if-shell "tmux select-window -t :6" "" "new-window -t :6 -c '#{pane_current_path}'"
bind-key -n M-7 if-shell "tmux select-window -t :7" "" "new-window -t :7 -c '#{pane_current_path}'"
bind-key -n M-8 if-shell "tmux select-window -t :8" "" "new-window -t :8 -c '#{pane_current_path}'"
bind-key -n M-9 if-shell "tmux select-window -t :9" "" "new-window -t :9 -c '#{pane_current_path}'"

##### SPLITS #####

# option + ;  → horizontal split
bind-key -n M-\: split-window -h -c "#{pane_current_path}"

# option + :  → vertical split
bind-key -n M-\; split-window -v -c "#{pane_current_path}"


##### TITLE SETTINGS #####

set-option -g set-titles on
set-option -g set-titles-string '#H:#S.#I.#P #W #T'
