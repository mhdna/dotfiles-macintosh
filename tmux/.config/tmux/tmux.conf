set -g @color-status-bg "#1d1d1d"
set -g @color-status-fg "#928374"
set -g @color-status-current-bg "#3c3836"
set -g @color-status-current-fg "#ebdbb2"
set -g @color-status-current-border "#ebdbb2"
set -g @color-status-alert "#770000"
set -g @color-mode-bg "#fabd2f"
set -g @color-mode-fg "#282828"
set -g @color-pane-border "#665c54"
set -g @color-pane-active-border "#665c54"




##### GENERAL SETTINGS #####

set -g base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 0
set -g focus-events on
set -gq allow-passthrough on

set -g status-keys emacs

set-option -g default-command "$SHELL"


##### PREFIX #####

unbind C-b
set -g prefix C-s
bind C-s send-prefix


##### RELOAD CONFIG #####

bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"


##### MOUSE #####

set -g mouse on

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" \
 "send-keys -M" \
 "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"

bind -n WheelDownPane select-pane -t= \; send-keys -M

bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M


##### COPY MODE (VIM STYLE) #####
# copies go through pbcopy (copy-pipe below); skip tmux's OSC 52 write, which
# Alacritty warns about whenever macOS refuses it
set -g set-clipboard off

setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/bin/xclip-or-wl-copy"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "~/bin/xclip-or-wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/bin/xclip-or-wl-copy"

bind-key -n M-s copy-mode


##### PANE NAVIGATION #####

bind-key -n M-\\ last-window
bind-key -n C-\\ last-window
bind-key l select-pane -R
bind-key k select-pane -U
bind-key j select-pane -D
bind-key h select-pane -L


##### PANE RESIZE #####

bind-key -r C-h resize-pane -L
bind-key -r C-j resize-pane -D
bind-key -r C-k resize-pane -U
bind-key -r C-l resize-pane -R


##### WINDOW MANAGEMENT #####

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# bind-key -n M-l last-window

bind-key -n C-1 if-shell 'tmux select-window -t :1' '' 'new-window -c "#{pane_current_path}" -t :1'
bind-key -n C-2 if-shell 'tmux select-window -t :2' '' 'new-window -c "#{pane_current_path}" -t :2'
bind-key -n C-3 if-shell 'tmux select-window -t :3' '' 'new-window -c "#{pane_current_path}" -t :3'
bind-key -n C-4 if-shell 'tmux select-window -t :4' '' 'new-window -c "#{pane_current_path}" -t :4'
bind-key -n C-5 if-shell 'tmux select-window -t :5' '' 'new-window -c "#{pane_current_path}" -t :5'
bind-key -n C-6 if-shell 'tmux select-window -t :6' '' 'new-window -c "#{pane_current_path}" -t :6'
bind-key -n C-7 if-shell 'tmux select-window -t :7' '' 'new-window -c "#{pane_current_path}" -t :7'
bind-key -n C-8 if-shell 'tmux select-window -t :8' '' 'new-window -c "#{pane_current_path}" -t :8'
bind-key -n C-9 run-shell 'tmux select-window -t :$(tmux list-windows | tail -n1 | cut -d ":" -f1)'


##### WINDOW ROTATION #####

bind -n C-t rotate-window


##### DETACH #####

bind-key -n M-q detach-client


##### APPLICATION SHORTCUTS #####

bind-key o new-window "htop"

bind-key -n M-i run-shell 'tmux-popup popup-main'
bind-key -n M-h run-shell 'tmux-scratchpad htop-scratch htop'
# bind-key -n M-o run-shell 'tmux-scratchpad lfrn-scratch lf "#{pane_current_path}"'
bind-key -n M-g run-shell 'tmux-scratchpad git-scratch lazygit -p "#{pane_current_path}"'
# alt+shift+o: (after a y/n popup) gather this session's panes into one window per project (~/.config/tmux/projects)
bind-key -n M-O run-shell -b '~/bin/tmux-organize "#{session_name}" --confirm'
# alt+u: jump to another window in this session (a centred fzf popup, alt+u again closes); enter switches, ctrl-x kills
bind-key -n M-u run-shell -b '~/bin/tmux-sessions'
# alt+shift+c: a number on each pane of this window; press one to close that
# pane, the others keep theirs until esc (any other key)
bind-key -n M-C run-shell '~/bin/tmux-close-panes "#{client_name}" "#{window_id}"'
bind-key -T close-panes 1 run-shell '~/bin/tmux-close-panes "#{client_name}" "#{window_id}" 1'
bind-key -T close-panes 2 run-shell '~/bin/tmux-close-panes "#{client_name}" "#{window_id}" 2'
bind-key -T close-panes 3 run-shell '~/bin/tmux-close-panes "#{client_name}" "#{window_id}" 3'
bind-key -T close-panes 4 run-shell '~/bin/tmux-close-panes "#{client_name}" "#{window_id}" 4'
bind-key -T close-panes 5 run-shell '~/bin/tmux-close-panes "#{client_name}" "#{window_id}" 5'
bind-key -T close-panes 6 run-shell '~/bin/tmux-close-panes "#{client_name}" "#{window_id}" 6'
bind-key -T close-panes 7 run-shell '~/bin/tmux-close-panes "#{client_name}" "#{window_id}" 7'
bind-key -T close-panes 8 run-shell '~/bin/tmux-close-panes "#{client_name}" "#{window_id}" 8'
bind-key -T close-panes 9 run-shell '~/bin/tmux-close-panes "#{client_name}" "#{window_id}" 9'
bind-key -T close-panes Any run-shell '~/bin/tmux-close-panes "#{client_name}" "#{window_id}" --done'
# ctrl+alt+shift+c: close every other pane in this window, after a y/n;
# ctrl+alt+shift+o: the same for panes sitting at a shell prompt. A Claude pane
# with uncommitted work is asked to commit instead. The terminal can't tell
# shift apart with ctrl held, so ctrl+alt+c / ctrl+alt+o do it too.
bind-key -n C-M-c run-shell '~/bin/tmux-close-panes "#{client_name}" "#{window_id}" --others "#{pane_id}"'
bind-key -n C-M-o run-shell '~/bin/tmux-close-panes "#{client_name}" "#{window_id}" --idle "#{pane_id}"'
set -g display-panes-colour "#7aa2f7"
set -g display-panes-active-colour "#f0c049"
# ...which lists windows by when you were last in them: each window you go to
# (or whose session you switch to) gets the next number of a counter
set-hook -g 'session-window-changed[90]' 'set -gF @used-seq "#{e|+:#{@used-seq},1}" ; set -wF @used "#{@used-seq}"'
set-hook -g 'client-session-changed[90]' 'set -gF @used-seq "#{e|+:#{@used-seq},1}" ; set -wF @used "#{@used-seq}"'


##### URL VIEWER #####

# prefix u: pick a link in this pane (a centred fzf popup); enter opens, ctrl-y copies
bind-key u run-shell -b "~/bin/tmux-open-url #{pane_id}"
# What the terminal (Alacritty, which calls itself xterm-256color) can do.
# Reset first so reloading this file doesn't stack duplicates.
#   sync:       synchronized output, so a resize or big redraw appears in one
#               frame instead of flickering through half-drawn panes
#   hyperlinks: let programs' clickable links (OSC 8) through
set -su terminal-features
set -as terminal-features ",xterm-256color:sync:RGB:hyperlinks"
set -as terminal-features ",alacritty*:sync:RGB:hyperlinks"


##### STATUS BAR #####
# Green, like tmux's default, with more on it:
#   [session]  1:zsh  2:nvim+        PREFIX  folder  branch │ 87% │ Fri 16 Oct 14:05
# (+ = zoomed pane; PREFIX / COPY show while a prefix key or copy mode is on)
# The gruvbox theme is still here, commented out, further down.
# set -g status-style "bg=default,fg=#a0a0a0"
set -g status-style "bg=#2e2924,fg=#d5c4a1" # dark greyish brown, warm sand text
# Alacritty's background is that brown too (so the bit below the bar matches);
# the panes, their borders and popups stay black
set -g window-style "bg=#000000"
set -g window-active-style "bg=#000000"
set -g popup-style "bg=#000000"
set -g pane-border-lines simple # ASCII - and |: the nearest tmux has to dashed
set -g pane-border-style "fg=#8a8a8a,bg=#000000"
set -g popup-border-style "fg=#8a8a8a,bg=#000000"
set -g pane-active-border-style "fg=#8a8a8a,bg=#000000"
set -g status-left-length 30
set -g status-right-length 120
# session name, hidden for now
# set -g status-left "#[fg=#7aa2f7,bold]#S#[default]  "
set -g status-left ""
set -g window-status-separator ""
# set -g window-status-format "#[fg=colour244] #I:#W#{?window_zoomed_flag,+,} #[default]"
set -g window-status-format "#[fg=#a89984] #I:#W#{?window_zoomed_flag,+,} #[default]"
# set -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W#{?window_zoomed_flag,+,} #[default]"
set -g window-status-current-format "#[bg=#000000,fg=#ea6962,bold] #I:#W#{?window_zoomed_flag,+,} #[default]"
set -g window-status-activity-style "fg=yellow"
set -g window-status-bell-style "fg=red"
# folder, branch, battery and date, hidden for now; just PREFIX / COPY
# while a prefix key or copy mode is on
# set -g status-right "#{?client_prefix,#[bg=#f0c049#,fg=#000000#,bold] PREFIX #[default] ,}#{?pane_in_mode,#[fg=#f0c049#,bold]COPY#[default]  ,}#{b:pane_current_path} #[bold]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null)#[nobold] │ #(pmset -g batt | grep -Eo '[0-9]+%%' | head -1) │ %a %d %b %H:%M "
set -g status-right "#{?client_prefix,#[bg=#f0c049#,fg=#000000#,bold] PREFIX #[default] ,}#{?pane_in_mode,#[fg=#f0c049#,bold]COPY#[default]  ,}"

# set -g status-style "bg=#{@color-status-bg},fg=#{@color-status-fg}"

# set-option -g status-justify left
set-option -g status-justify centre # tabs in the middle
# Three rows: details on top (folder, git branch, battery, time), then the
# tabs (tmux's usual line, moved down to the second row), then a blank row
# (reset first so reloading doesn't copy the details row)
set -g status 3
set -gu status-format
run-shell 'tmux set -g "status-format[1]" "$(tmux show -gv "status-format[0]")" \; set -g "status-format[2]" ""'
set -g "status-format[0]" "#[align=left]  #[fg=#a9b665,bold]#{s|^$HOME|~|:pane_current_path}#[nobold]  #[fg=#e78a4e]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null)#[align=right]#[fg=#a89984]#(pmset -g batt | grep -Eo '[0-9]+%%' | head -1)  #[fg=#d5c4a1]%a %d %b %H:%M  "
# at the top a window that isn't a whole number of rows tall leaves its black
# sliver under the panes instead of under the bar, but the top row ended up
# hidden behind the window's top edge
# set -g status-position top
set -g status-position bottom
set-option -g status-interval 5 # git and battery are looked up this often

