# pinkish/cyan theme
# set-window-option -g window-status-current-style fg=white
# set-window-option -g window-status-current-style bg=white
setw -g window-status-current-style reverse
setw -g automatic-rename
set-option -g status-justify left
setw -g window-status-current-format '#I: #W'
set -g window-status-format '#I: #W'
# set-option -g status-bg "#000000" # colour213 # pink
# set-option -g status-fg "#ffffff"
set -g status-bg "#000000"
set -g status-fg "#928374"
set -g window-status-current-style 'bg=#000000,fg=#ffffff,bold' # ,bold
set-option -g status-interval 1
# set-option -g status-left '#[fg=#ffffff,bold]» #[default]'
set-option -g status-left ''
set-option -g status-right ' #[fg=#928374][#[fg=#928374]#S#[fg=#928374,default]]'
# set-option -g status-right ' #[fg=#928374][#[fg=#928374]#S#[fg=#928374,default]] #(while true; do ~/bin/i3-statusbar/batt-status2; sleep 2; done)'
set-option -g visual-activity off
set-option -g set-titles on
set-option -g set-titles-string '#H:#S.#I.#P #W #T'

# open new windows and splits with current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind-key -n M-\; split-window -c "#{pane_current_path}"
bind-key -n M-\: split-window -h -c "#{pane_current_path}"

bind-key -n C-1 if-shell 'tmux select-window -t :1' '' 'new-window -c "#{pane_current_path}" -t :1'
bind-key -n C-2 if-shell 'tmux select-window -t :2' '' 'new-window -c "#{pane_current_path}" -t :2'
bind-key -n C-3 if-shell 'tmux select-window -t :3' '' 'new-window -c "#{pane_current_path}" -t :3'
bind-key -n C-4 if-shell 'tmux select-window -t :4' '' 'new-window -c "#{pane_current_path}" -t :4'
bind-key -n C-5 if-shell 'tmux select-window -t :5' '' 'new-window -c "#{pane_current_path}" -t :5'
bind-key -n C-6 if-shell 'tmux select-window -t :6' '' 'new-window -c "#{pane_current_path}" -t :6'
bind-key -n C-7 if-shell 'tmux select-window -t :7' '' 'new-window -c "#{pane_current_path}" -t :7'
bind-key -n C-8 if-shell 'tmux select-window -t :8' '' 'new-window -c "#{pane_current_path}" -t :8'
bind-key -n C-9 run-shell 'tmux select-window -t :$(tmux list-windows | tail -n1 | cut -d ":" -f1)'

# bind-key -n M-\; next-window
# bind-key -n M-g previous-window

bind-key -n M-i last-window

bind-key -n M-1 if-shell 'tmux select-window -t :1' '' 'new-window -c "#{pane_current_path}" -t :1'
bind-key -n M-2 if-shell 'tmux select-window -t :2' '' 'new-window -c "#{pane_current_path}" -t :2'
bind-key -n M-3 if-shell 'tmux select-window -t :3' '' 'new-window -c "#{pane_current_path}" -t :3'
bind-key -n M-4 if-shell 'tmux select-window -t :4' '' 'new-window -c "#{pane_current_path}" -t :4'
bind-key -n M-5 if-shell 'tmux select-window -t :5' '' 'new-window -c "#{pane_current_path}" -t :5'
bind-key -n M-6 if-shell 'tmux select-window -t :6' '' 'new-window -c "#{pane_current_path}" -t :6'
bind-key -n M-7 if-shell 'tmux select-window -t :7' '' 'new-window -c "#{pane_current_path}" -t :7'
bind-key -n M-8 if-shell 'tmux select-window -t :8' '' 'new-window -c "#{pane_current_path}" -t :8'
bind-key -n M-9 run-shell 'tmux select-window -t :$(tmux list-windows | tail -n1 | cut -d ":" -f1)' ''

# clock
# set-option -g status-right '%H:%M %Y-%m-%d'

# Bindings
bind-key -n M-w run-shell 'tmux-popup popup-main'
# bind-key -n M-a run-shell 'tmux-popup popup-ai'
# bind-key -n M-i run-shell 'tmux-popup popup-nmtui nmtui'
bind-key -n M-l run-shell 'tmux-scratchpad lfrun lfrun'
bind-key -n M-h run-shell 'tmux-scratchpad htop-scratch htop'
bind-key -n M-g run-shell 'tmux-scratchpad git-scratch lazygit -p "#{pane_current_path}"'
# bind-key -n M-l run-shell 'popuptmuxlf'
bind-key -n M-s copy-mode

# bind-key C-l select-pane -R
# bind-key C-h select-pane -L
# bind-key C-k select-pane -U
# bind-key C-j select-pane -D
bind C new-window -c '#{pane_current_path}'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip-or-wl-copy"
# Application bindings
bind-key o neww "htop"
bind-key -n M-q detach-client
bind -n C-t rotate-window


# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
# bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
# bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
# bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
# bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

# Browser urls
bind-key u capture-pane \; save-buffer /tmp/tmux-buffer \; new-window -n "urlview" '$SHELL -c "urlview < /tmp/tmux-buffer"'

# saving sessions
set -g @resurrect-capture-pane-contents 'on'
