# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/main/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  bindings.commands:
    global:
      normal:
        ',A': spawn -d mpv  --profile=pseudo-gui --loop=inf {url}
        ',M': spawn -d mpv {url}
        ',R': spawn --userscript readability
        ',a': hint links spawn -d mpv --profile=pseudo-gui --loop=inf {hint-url}
        ',b': spawn -d firefox {url}
        ',ce': config-edit
        ',d': hint links spawn yt-menu {hint-url}
        ',g': spawn --userscript qute_search -g
        ',m': hint links spawn mpv $1 {hint-url}
        ',p': config-cycle -p content.plugins ;; reload
        ',rta': open {url}top/?sort=top&t=all
        ',rtv': spawn st -e "rtv {url}"
        ;;: config-cycle statusbar.show in-mode always ;; config-cycle tabs.show switching
          always;; config-cycle content.notifications.enabled true false
        ;p: hint links spawn kdeconnect-cli --share-text {url} --device 415a811582e4a899
        <Alt+j>: tab-move -
        <Alt+k>: tab-move +
        <Alt+p>: tab-pin
        <Ctrl+Alt+r>: spawn bach -c 'echo {url}{title} >> ~/dox/notes/todo.txt &&
          notify-send -t 1500 'Read Later''
        <Ctrl+Shift+i>: config-cycle colors.webpage.darkmode.enabled ;; restart
        <Ctrl+Shift+o>: download-open
        <Ctrl+Shift+p>: open -p
        <Ctrl+Shift+r>: restart
        <Ctrl+o>: spawn --userscript opendownload
        <Ctrl+q>: null
        <Ctrl+x>: tab-focus last ;; repeat-until-not-found about:blank tab-close
        D: hint images download
        J: tab-prev
        K: tab-next
        M: quickmark-save
        Q: spawn --userscript qr
        T: open -t
        X: undo
        ad: null
        b: null
        baA: hint links spawn --userscript bm_add {hint-url}
        baR: hint links spawn --userscript bm_add {hint-url} readlater
        baW: hint links spawn --userscript bm_add {clipboard}
        baa: spawn --userscript bm_add {url}
        bac: spawn --userscript bm_add {clipboard}
        bar: spawn --userscript bm_add {url} readlater
        baw: spawn --userscript bm_add {url} watchlater
        bb: spawn --userscript bm_list
        bd: spawn --userscript bm_del {url}
        br: spawn --userscript bm_list
        bt: spawn --userscript bm_list -t
        cD: download-cancel
        cd: download-clear
        cf: hint -r links
        cm: clear-messages
        cq: spawn --userscript reload-quickmarks
        cr: config-source
        d: scroll-page 0 0.5
        gH: history
        gS: view-source
        gf: null
        gh: home
        gm: tab-give
        gs: spawn --userscript selection.sh
        m: 'cmd-set-text -s :quickmark-load '
        pa: spawn --userscript print -a
        pr: spawn --userscript print
        pt: open -t -- {clipboard}
        t: cmd-set-text -s :tab-focus
        u: scroll-page 0 -0.5
        x: tab-close
        yA: hint -r links yank
        yP: yank pretty-url
        ya: hint links yank
        yp: spawn kdeconnect-cli --refresh && kdeconnect-cli --share-text {url} --device
          415a811582e4a899
      prompt:
        <Ctrl+b>: rl-beginning-of-line
        <Ctrl+d>: rl-delete-char
        <Ctrl+e>: rl-end-of-line
  colors.webpage.darkmode.enabled:
    global: true
  content.javascript.clipboard:
    https://classroom.google.com: access-paste
    https://github.com: access-paste
  content.plugins:
    global: false
  url.default_page:
    global: https://lite.duckduckgo.com
  url.start_pages:
    global: https://lite.duckduckgo.com
