# import = ["~/.config/alacritty/themes/light-xterm.toml"]
# import = ["~/.config/alacritty/themes/gruvbox-dark.toml"]
general.import = ["~/.config/alacritty/themes/xterm.toml"]

[colors.primary]
background = '#000000'
foreground = '#ffffff'

[colors.cursor]
cursor = "#ffffff"
text = "CellBackground"

[colors.hints.end]
background = "#1d1f21"
foreground = "#fabd2f"

[colors.hints.start]
background = "#fabd2f"
foreground = "#1d1f21"

[cursor.style]
blinking = "always"

# [cursor]
# blink_interval = 500
# shape = "underline"

# [cursor]
# thickness = 0.5

# [cursor.vi_mode_cursor]
# cursor = "0x000000"
# text = "0x000000"

[env]
TERM = "xterm-256color"

[font]
size = 14

[font.bold]
family = "monospace"
style = "Bold"

[font.bold_italic]
family = "monospace"
style = "Bold Italic"

[font.italic]
family = "monospace"
style = "Italic"

[font.normal]
family = "monospace"
style = "Regular"

[[hints.enabled]]
command = "xdg-open"
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.binding]
key = "L"
mods = "Alt"

[keyboard]
bindings = [
# { key= "I", mods= "Control", chars=  '\033[105;4u'},
{ key= "C", mods= "Alt", action=  "Copy"},
{ key= "V", mods= "Alt", action=  "Paste"},
{ key= "Y", mods= "Alt", action=  "PasteSelection"},
]

[mouse]
hide_when_typing = true

[window.dimensions]
columns = 73
lines = 28

# [window]
# opacity = 0.7
